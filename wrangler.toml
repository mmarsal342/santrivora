name = "santrivora"
main = "src/worker.ts"
compatibility_date = "2024-04-01"
workers_dev = true

# Static assets (frontend dist)
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[build]
command = "cd frontend && npm run build"

# Development environment (default / local) — D1 + KV terpisah dari
# staging/production (dulu ketiganya share resource yang sama persis, lihat
# audit MEDIUM #7).
[[d1_databases]]
binding = "DB"
database_name = "santrivora-db-dev"
database_id = "20f10412-42ac-4c48-b5a9-7e412a3ba935"

[[kv_namespaces]]
binding = "KV"
id = "172f4c5d0aaa4a44a962df5ff516dca4"
preview_id = "172f4c5d0aaa4a44a962df5ff516dca4"

[[r2_buckets]]
binding = "R2"
bucket_name = "santrivora-photos"

[vars]
ENVIRONMENT = "development"

# Staging environment
[env.staging]
name = "santrivora-staging"
vars = { ENVIRONMENT = "staging" }

[env.staging.assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "santrivora-db-staging"
database_id = "9a916970-7831-458b-b864-87ee117109b1"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "542965c01cd24f3891c27c73f65587ae"
preview_id = "542965c01cd24f3891c27c73f65587ae"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "santrivora-photos"

# Production environment
[env.production]
name = "santrivora-production"
vars = { ENVIRONMENT = "production" }

[env.production.assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.production.build]
command = "cd frontend && npm run build"

[[env.production.d1_databases]]
binding = "DB"
database_name = "santrivora-db"
database_id = "606a3c63-02e2-44f5-a3f3-b7f069df7499"

[[env.production.kv_namespaces]]
binding = "KV"
id = "dce5e0ce216547beb570865b4f2bdb53"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "santrivora-photos"