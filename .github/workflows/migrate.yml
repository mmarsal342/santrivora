name: Run DB Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      migration_file:
        description: 'Migration file path relative to repo root'
        required: true
        default: src/db/migrations/002_kamar_kegiatan_absensi_haid.sql

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # migration_file dulu free-text tanpa validasi apapun — bisa diarahkan ke
      # src/db/seeds/ (isinya admin default dengan password terdokumentasi di
      # komentar) atau path lain sama sekali, lalu dijalankan langsung ke
      # production. Wajib match folder migrations resmi + pola penamaan
      # NNN_nama.sql, dan file-nya harus benar-benar ada di repo.
      - name: Validate migration file path
        run: |
          file="${{ inputs.migration_file }}"
          if [[ ! "$file" =~ ^src/db/migrations/[0-9]{3}_[A-Za-z0-9_]+\.sql$ ]]; then
            echo "::error::migration_file harus path migrasi resmi (src/db/migrations/NNN_nama.sql), bukan: $file"
            exit 1
          fi
          if [ ! -f "$file" ]; then
            echo "::error::File tidak ditemukan di repo: $file"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Resolve D1 database name for environment
        id: vars
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "db=santrivora-db" >> "$GITHUB_OUTPUT"
          else
            echo "db=santrivora-db-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Run migration against remote D1 (${{ inputs.environment }})
        run: npx wrangler d1 execute ${{ steps.vars.outputs.db }} --env ${{ inputs.environment }} --remote --file=${{ inputs.migration_file }} -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
